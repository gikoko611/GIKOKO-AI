name: Build G.I KO KO AI APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.5 (with dependency cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug + release APK
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Verify APK contents
        run: |
          set -e
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/GIKOKOAI-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/GIKOKOAI-release.apk
          for f in dist/*.apk; do
            echo "== $f"; ls -l "$f"
            unzip -l "$f" | grep -E "classes.dex|AndroidManifest.xml" 
            echo "Native libs:"; unzip -l "$f" | grep "lib/" || echo "none (pure Kotlin/Java - runs on armeabi-v7a and arm64-v8a)"
          done
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/aapt dump badging dist/GIKOKOAI-debug.apk | grep -E "package:|native-code|sdkVersion" || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GIKOKOAI-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
